version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: expense-tracker-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: expense-tracker-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - '5000:5000'
    environment:
      MONGO_URI: mongodb://mongo:27017/smart_expense_tracker
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_in_production}
      PORT: 5000
      CLIENT_URL: http://localhost:5173
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build: ./frontend
    container_name: expense-tracker-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '5173:80'

volumes:
  mongo_data:
  uploads_data:
